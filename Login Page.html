<body>
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - HS Royal Cosmetics</title>
  <style>
    body {
      background: linear-gradient(to right, #ff69b4, #ffffff);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
    }
    h2 {
      text-align: center;
      color: #ff69b4;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #ff69b4;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;  
    }
    button:hover {
      background-color: #e60073;
    }
    .extra-options {
      text-align: center;
      margin-top: 15px;
    }
    .extra-options a {
      display: inline-block;
      margin: 5px 10px;
      color: #ff69b4;
      text-decoration: none;
      font-size: 14px;
    }
    .extra-options a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form>
      <input type="text" placeholder="Email or Username" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <div class="extra-options">
      <a href="#">Register</a> | 
      <a href="#">Forgot Password?</a>
    </div>
  </div>
</body>
</html>
</body>
</html>
